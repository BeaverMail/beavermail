# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "beavermail-imap"
description = "Read-only IMAP backend for BeaverMail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
beavermail-core.workspace = true
beavermail-store.workspace = true
beavermail-vault.workspace = true
beavermail-crypto.workspace = true
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
log = "0.4"
mail-parser = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
