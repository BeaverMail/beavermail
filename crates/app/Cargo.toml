[package]
name = "beavermail"
description = "BeaverMail desktop client (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
beavermail-core.workspace = true
eframe.workspace = true
egui_extras.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opener = { version = "0.8", default-features = false }
# The diagnostic log; already in the tree through eframe.
log = "0.4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
scraper.workspace = true
ureq.workspace = true
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true
anyrender.workspace = true
anyrender_vello_cpu.workspace = true
beavermail-accounts.workspace = true
beavermail-imap.workspace = true
beavermail-smtp.workspace = true
beavermail-store.workspace = true
beavermail-crypto.workspace = true
beavermail-carddav.workspace = true
beavermail-vault.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
# Times on this computer's clock for "send later"; already in the tree through the store.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Contact photos: read, and made small for the card; already in the tree through the HTML renderer.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Domains as people read them, for the look-alike checks: punycode decoded (already in the tree through
# url) and look-alike characters folded by Unicode's confusables (UTS #39).
idna = "1"
unicode-security = "0.1"

# Windows draws through Direct3D (wgpu), which a machine without a graphics driver still has in
# software; its OpenGL is 1.1, too old for the OpenGL renderer the other systems use.
[target.'cfg(windows)'.dependencies]
eframe = { workspace = true, features = ["wgpu"] }

# The .exe's own icon, shown by Explorer, the taskbar and the installer (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# The .deb made by cargo-deb in the Linux workflow; its dependencies are found from the binary.
[package.metadata.deb]
maintainer = "BeaverMail contributors"
section = "mail"
assets = [
    ["target/release/beavermail", "usr/bin/", "755"],
    ["packaging/beavermail.desktop", "usr/share/applications/", "644"],
    ["assets/beavermail.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
