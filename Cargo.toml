# SPDX-License-Identifier: AGPL-3.0-only

[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/imap", "crates/accounts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.90"

[workspace.dependencies]
beavermail-core = { path = "crates/core" }
pollster = "0.4"
beavermail-imap = { path = "crates/imap" }
beavermail-accounts = { path = "crates/accounts" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
