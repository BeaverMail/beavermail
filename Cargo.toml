# SPDX-License-Identifier: AGPL-3.0-only

[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/imap", "crates/accounts", "crates/smtp", "crates/store", "crates/vault"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.90"

[workspace.dependencies]
beavermail-core = { path = "crates/core" }
pollster = "0.4"
beavermail-imap = { path = "crates/imap" }
beavermail-accounts = { path = "crates/accounts" }
beavermail-smtp = { path = "crates/smtp" }
beavermail-store = { path = "crates/store" }
beavermail-vault = { path = "crates/vault" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
scraper = { version = "0.27", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# egui, resvg and the rest are unusably slow unoptimised (frames of half a second, which the
# desktop reports as "Application Not Responding"); our own crates stay fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
